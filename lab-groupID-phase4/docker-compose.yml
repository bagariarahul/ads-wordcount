# docker compose up -d --build
# docker exec client python -m wordcount.client moby_dick whale
# docker compose logs -f lb
#
# The load balancer settings are in .env; after changing them run: docker compose up -d lb
# init: true makes docker stop stop a container at once (python as process 1 ignores SIGTERM).

services:
  redis:
    image: redis:7.4-alpine
    container_name: redis

  server1:
    build: .
    container_name: server1
    command: python -m wordcount.server
    init: true
    environment:
      SERVER_ID: server1
    volumes:
      - ./corpus:/data/corpus:ro
    depends_on:
      - redis

  server2:
    build: .
    container_name: server2
    command: python -m wordcount.server
    init: true
    environment:
      SERVER_ID: server2
    volumes:
      - ./corpus:/data/corpus:ro
    depends_on:
      - redis

  server3:
    build: .
    container_name: server3
    command: python -m wordcount.server
    init: true
    environment:
      SERVER_ID: server3
    volumes:
      - ./corpus:/data/corpus:ro
    depends_on:
      - redis

  lb:
    build: .
    container_name: lb
    command: python -m balancer.proxy
    init: true
    environment:
      SERVERS: server1,server2,server3
      LB_ALGORITHM: ${LB_ALGORITHM:-least_connections}
      HEALTH_CHECKS: ${HEALTH_CHECKS:-on}
    depends_on:
      - server1
      - server2
      - server3

  # the client only waits; commands are run in it with docker exec
  client:
    build: .
    container_name: client
    command: sleep infinity
    init: true
    environment:
      HOST: lb
    volumes:
      - ./corpus:/data/corpus:ro
      - ./results:/app/results
    depends_on:
      - lb
